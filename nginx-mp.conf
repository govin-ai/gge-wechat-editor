server {
    listen 80;
    listen [::]:80;
    server_name mp.ggelabs.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://mp.ggelabs.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mp.ggelabs.com;

    ssl_certificate /etc/letsencrypt/live/mp.ggelabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mp.ggelabs.com/privkey.pem;
    access_log /var/log/nginx/mp.ggelabs.access.log;

    server_tokens off;
    root /var/www/mp.ggelabs.com/current;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /stats {
        return 301 /stats/;
    }

    location = /stats/ {
        auth_basic "G哥访问统计";
        auth_basic_user_file /etc/nginx/mp-stats.htpasswd;
        root /var/www/mp.ggelabs.com;
        try_files /stats/index.html =404;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "no-store" always;
    }

    location ~ /\. {
        return 404;
    }

    location = /index.html {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
